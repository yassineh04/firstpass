# Weekly dependency updates. The 14-day cooldown matches the project rule: only adopt
# versions published at least two weeks ago. Grouping keeps the number of pull requests low.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      gradle-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
