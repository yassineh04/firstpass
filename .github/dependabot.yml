# Weekly dependency updates. The 14-day cooldown matches the project rule: only adopt
# versions published at least two weeks ago. Grouping keeps the number of pull requests low.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Kotlin 2.4 is fully supported up to Gradle 9.7. Lift this when a Kotlin release supports a newer Gradle.
      - dependency-name: gradle-wrapper
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      gradle-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # vue-tsc does not support TypeScript 7 yet. Lift this when it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node.js types follow the Node.js version we run, not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # vitest and its plugins must always share one version. Listed first: a dependency
      # joins the first group it matches.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
