name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repository.
permissions:
  contents: read

# Cancel superseded runs on pull requests; never cancel runs on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the checksums file of the official release.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle files and validates the checksum of gradle-wrapper.jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build, lint, test and check coverage
        run: ./gradlew build --console=plain

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports
          path: backend/**/build/reports/
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and check formatting
        run: |
          npm run lint
          npm run format:check

      - name: Type-check and build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-reports
          path: |
            frontend/playwright-report/
            frontend/coverage/
          retention-days: 7

  infra:
    name: infra
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.7"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # No backend in CI: the tests use a mocked provider and need no AWS credentials.
      - name: Initialize from the lock file
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate

      - name: Run Terraform tests
        run: terraform test

      - name: Check resource types against the $0 allowlist
        run: bash scripts/check-resource-types.sh

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: TFLint
        run: tflint --format compact

      - name: Checkov
        run: docker run --rm -v "$PWD:/tf" bridgecrew/checkov:3.3.30 -d /tf --framework terraform --quiet --compact
