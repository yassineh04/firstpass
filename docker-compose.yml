# Local development services.
#   docker compose up -d                     DynamoDB Local
#   docker compose --profile ollama up -d    also Ollama, a local LLM (large download)
name: firstpass

services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    working_dir: /home/dynamodblocal
    # In memory, one shared database: data resets on restart, and the backend recreates its table.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      # Bound to this machine only, never exposed to the network.
      - "127.0.0.1:8000:8000"

  ollama:
    image: ollama/ollama:0.40.11
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
